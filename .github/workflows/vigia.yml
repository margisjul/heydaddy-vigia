# Vigilante externo de TODOS los productos de Julián (HeyDaddy, Originl, FirstStone, Settr, Cimiento, Marca Personal,
# Emprendedores Paraguay). Va en .github/workflows/ del repositorio PÚBLICO margisjul/heydaddy-vigia
# (los repositorios públicos no gastan minutos de GitHub Actions). Ver deploy/vigia_externo/LEEME en el
# informe de Z30 para los secretos.
name: Vigía de productos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # solo para el latido mensual que evita que GitHub apague el cron por inactividad

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar el estado de la pasada anterior
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: vigia-estado-${{ github.run_id }}
          restore-keys: vigia-estado-
      - name: Comprobar todos los productos
        env:
          # Telegram es opcional: sin estos dos secretos solo se manda correo.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Obligatorio para recibir correos; el resto tiene valor por defecto o es opcional.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Dirección pública del editor de Originl (servicio del motor en Railway); sin ella no se vigila el editor.
          ORIGINL_EDITOR_URL: ${{ secrets.ORIGINL_EDITOR_URL || vars.ORIGINL_EDITOR_URL }}
        run: python3 vigia.py estado.json
      - name: Guardar el estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: vigia-estado-${{ github.run_id }}
      - name: Latido mensual (GitHub apaga los cron de repos sin actividad en 60 días)
        run: |
          if [ "$(date -u +%d%H%M | cut -c1-4)" = "0100" ] || [ ! -f latido.txt ]; then
            date -u +%Y-%m-%dT%H:%MZ > latido.txt
            git config user.name "heydaddy-vigia"; git config user.email "vigia@users.noreply.github.com"
            git add latido.txt && git commit -m "Latido del vigía" && git push || true
          fi
